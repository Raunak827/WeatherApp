<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Bites - Menu</title>
    <style>
        body {
            background-color: #fdfbf7;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .menu-container {
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            color: #b22222;
        }

        .category-title {
            font-size: 1.5em;
            color: #444;
            border-bottom: 2px solid #b22222;
            padding-bottom: 5px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .item-info {
            padding-right: 20px;
        }

        .item-name {
            font-size: 1.1em;
            color: #222;
        }

        .item-price {
            font-weight: bold;
            color: #b22222;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <header>
            <h1>Delicious Bites</h1>
        </header>
        <div class="category-title">Starters</div>
        
        <div class="menu-item">
            <div class="item-info">
                <div class="item-name">Crispy Spring Rolls</div>
            </div>
            <div class="item-price">49 Rs</div>
        </div>

        <div class="menu-item">
            <div class="item-info">
                <div class="item-name">Garlic Butter Bruschetta</div>
            </div>
            <div class="item-price">119 Rs</div>
        </div>
        <div class="category-title">Main Course</div>

        <div class="menu-item">
            <div class="item-info">
                <div class="item-name">Classic Margherita Pizza</div>
            </div>
            <div class="item-price">149 Rs</div>
        </div>

        <div class="menu-item">
            <div class="item-info">
                <div class="item-name">Chicken Biryani</div>
            </div>
            <div class="item-price">320 Rs</div>
        </div>

        <div class="menu-item">
            <div class="item-info">
                <div class="item-name">Garlic Naan</div>
            </div>
            <div class="item-price">40 Rs</div>
        </div>
        <div class="category-title">Desserts</div>

        <div class="menu-item">
            <div class="item-info">
                <div class="item-name">Cheesecake</div>
            </div>
            <div class="item-price">99 Rs</div>
        </div>

        <div class="menu-item">
            <div class="item-info">
                <div class="item-name">Chocolate Lava Cake</div>
            </div>
            <div class="item-price">149 Rs</div>
        </div>
    </div>

</body>
</html>
