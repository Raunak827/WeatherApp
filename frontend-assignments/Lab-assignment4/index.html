<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopDynamic - Dynamic E-commerce Product Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="#" class="brand">
        <span class="brand-icon" aria-hidden="true">&#128717;</span>
        <span class="brand-name">ShopDynamic</span>
      </a>
      <nav class="nav-links">
        <a href="#home" class="nav-link active">Home</a>
        <a href="#shop" class="nav-link">Shop</a>
        <a href="#about" class="nav-link">About</a>
      </nav>
    </div>

    <div class="nav-right">
      <button id="cart-toggle-btn" class="cart-icon-btn" aria-label="Toggle Shopping Cart">
        <span class="cart-icon" aria-hidden="true">&#128722;</span>
        <span id="cart-badge" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- Main Page Layout -->
  <div class="page-layout">
    <!-- Dynamic Product Grid -->
    <main class="main-content" id="shop">
      <section id="product-grid" class="product-grid" aria-label="Product List">
        <!-- Product cards are dynamically injected by script.js -->
      </section>
    </main>

    <!-- Shopping Cart Sidebar -->
    <aside id="cart-sidebar" class="cart-sidebar" aria-label="Shopping Cart">
      <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button id="close-cart-btn" class="close-cart-btn" aria-label="Close Shopping Cart">&times;</button>
      </div>

      <div id="cart-items" class="cart-items">
        <!-- Cart items are dynamically injected by script.js -->
      </div>

      <div class="cart-footer">
        <h3 class="cart-total-heading">Cart Total</h3>
        <div class="cart-summary-row">
          <span>Items:</span>
          <span id="cart-total-items">0</span>
        </div>
        <div class="cart-grand-total">
          <span>Grand Total:</span>
          <span id="cart-grand-total">&#8377; 0</span>
        </div>
        <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
