<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Weather App</h1>
    </header>

    <main>
        <section class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-btn">Search</button>
        </section>

        <p id="error-message" style="display: none;"></p>

        <section class="weather-card" id="weather-card" style="display: none;">
            <h2 id="location">Delhi, India</h2>
            <div id="weather-icon">☀️</div>
            <h3 id="temperature">32°C</h3>
            <p id="condition">Clear</p>
            
            <div class="weather-details">
                <p id="humidity">Humidity: 45%</p>
                <p id="wind-speed">Wind: 14 km/h</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
