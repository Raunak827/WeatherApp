<!DOCTYPE html>
<html lang="en">
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Weather App</h1>
    </header>

    <main>
        <section class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-btn">Search</button>
        </section>

        <p id="error-message" style="display: none;"></p>

        <section class="weather-card" id="weather-card" style="display: none;">
            <h2 id="location">Delhi, India</h2>
            <div id="weather-icon">☀️</div>
            <div class="temperature-container">
                <h3 id="temperature">32°C</h3>
                <p id="feels-like">Feels like: 38°C</p>
            </div>
            <p id="condition">Clear</p>
            
            <div class="weather-details">
                <p id="humidity">Humidity: 45%</p>
                <p id="wind-speed">Wind: 14 km/h</p>
                <p id="temp-min-max">Min: 28°C / Max: 35°C</p>
            </div>
            <div class="advisory-section" id="advisory-section">
                <h3>Advice</h3>
                <ul id="advisory-list">
                    <li>Very high heat: avoid going out between 12 and 4 PM and drink water regularly.</li>
                    <li>High humidity: clothes will not dry outdoors.</li>
                </ul>
            </div>
        </section>
    </main>

    <script src="advisory-rules.js"></script>
    <script src="script.js"></script>
</body>
</html>
